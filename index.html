<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Runner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="assets/icon/icon.png" type="image/png">
</head>
<body>
    <div id="app">
        <header id="topbar">
            <h1>MAZE RUNNER</h1>
            <div id="status-bar">
                <span id="status-msg">Generating maze...</span>
            </div>
            <div id="top-actions">
                <button id="runBtn" class="btn btn-run">▶ Run</button>
                <button id="resetBtn" class="btn btn-reset">⟲ Reset</button>
                <button id="newMazeBtn" class="btn btn-new">✦ New</button>
            </div>
        </header>
        <main id="main">
            <section id="maze-panel">
                <div id="maze"></div>
            </section>
            <section id="builder-panel">
                <div id="block-palette">
                    <button class="block-btn forward" data-block="forward">↑ Forward</button>
                    <button class="block-btn left" data-block="turnLeft">↰ Left</button>
                    <button class="block-btn right" data-block="turnRight">↱ Right</button>
                    <button class="block-btn repeat" data-block="repeat">⟳ Loop</button>
                </div>
                <div id="scope-indicator">
                    Adding to: <span id="scope-label">Program</span>
                </div>
                <div id="program-area">
                    <div id="program-list"></div>
                    <div id="program-placeholder">Add blocks to build your path</div>
                </div>
            </section>
        </main>
    </div>
    <script src="maze_generator.js"></script>
    <script src="enemy.js"></script>
    <script src="renderer.js"></script>
    <script src="path_builder.js"></script>
    <script src="game.js"></script>
    <script>
        window.game = new Game();
    </script>
</body>
</html>
